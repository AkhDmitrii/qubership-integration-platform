name: QIP issue triage
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: Open issue number
        type: string
        required: true
      engineer_decision:
        description: Your assessment before seeing the recommendation
        type: choice
        required: true
        options: [uncertain, ready, diagnose, request_info]

permissions: {}

jobs:
  triage:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issues' && vars.AGENT_PRE_READY_ON_OPEN == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    env:
      ISSUE_NUMBER: ${{ github.event_name == 'issues' && github.event.issue.number || inputs.issue }}
      ENGINEER_DECISION: ${{ inputs.engineer_decision }}
    steps:
      - name: Validate the issue number
        shell: bash
        run: '[[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: tools/autonomous-fixer/go.mod
          cache: false
      - name: Authorize the manual operator
        if: github.event_name == 'workflow_dispatch'
        working-directory: tools/autonomous-fixer
        env:
          AGENT_ALLOWED_ACTORS: ${{ vars.AGENT_ALLOWED_ACTORS }}
          GOTOOLCHAIN: local
        shell: bash
        run: go run ./cmd/agent authorize
      - name: Read the issue
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/triage"
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/triage/issue.json"
          python3 tools/autonomous-fixer/scripts/pre_ready.py prepare "$RUNNER_TEMP/triage"
      - name: Build the classifier
        if: steps.snapshot.outputs.eligible == 'true'
        working-directory: tools/autonomous-fixer
        run: go build -trimpath -o "$RUNNER_TEMP/jev-task" ./cmd/jev-task
      - name: Classify the issue
        if: steps.snapshot.outputs.eligible == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: '"$RUNNER_TEMP/jev-task" --packet "$RUNNER_TEMP/triage/packet.json" --output "$RUNNER_TEMP/triage/jev" --live'
      - name: Recheck the issue
        if: always() && steps.snapshot.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/triage/rechecked.json" && mv "$RUNNER_TEMP/triage/rechecked.json" "$RUNNER_TEMP/triage/current.json"
      - name: Write the recommendation to the run summary
        id: summary
        if: always() && steps.snapshot.outcome == 'success'
        run: python3 tools/autonomous-fixer/scripts/pre_ready.py summary "$RUNNER_TEMP/triage"
      - name: Save the recommendation
        if: always() && steps.summary.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pre-ready-triage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/triage/recommendation.md
          if-no-files-found: error
